name: FooTube
options:
  deploymentTarget:
    tvOS: "18.0"
    iOS: "18.0"
  createIntermediateGroups: true
# Team and bundle ID prefix: Config/Signing.xcconfig (+ your Config/Signing.local.xcconfig).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  FooTubeCore:
    path: Packages/FooTubeCore
targets:
  # One app for Apple TV, iPhone and iPad: shared code in App/, platform screens in App/tvOS and App/iOS.
  FooTube:
    type: application
    supportedDestinations: [tvOS, iOS]
    sources:
      - path: App
        excludes:
          - "tvOS/**"
          - "iOS/**"
      - path: App/tvOS
        destinationFilters: [tvOS]
      - path: App/iOS
        destinationFilters: [iOS]
    dependencies:
      - package: FooTubeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FOOTUBE_BUNDLE_ID_PREFIX).FooTube
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FooTube
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2,3"
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]": "App Icon & Top Shelf Image"
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphone*]": AppIcon
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphone*]": YES
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone[sdk=iphone*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad[sdk=iphone*]": "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme:
      testTargets:
        - FooTubeUITests
  FooTubeUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - UITests
    dependencies:
      - target: FooTube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FOOTUBE_BUNDLE_ID_PREFIX).FooTubeUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FooTube
