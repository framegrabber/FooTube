name: FooTube
options:
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
# Team and bundle ID prefix: Config/Signing.xcconfig (+ your Config/Signing.local.xcconfig).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  FooTubeCore:
    path: Packages/FooTubeCore
targets:
  FooTube:
    type: application
    platform: tvOS
    sources:
      - App
    dependencies:
      - package: FooTubeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FOOTUBE_BUNDLE_ID_PREFIX).FooTube
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FooTube
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    scheme:
      testTargets:
        - FooTubeUITests
  FooTubeUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - UITests
    dependencies:
      - target: FooTube
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FOOTUBE_BUNDLE_ID_PREFIX).FooTubeUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FooTube
